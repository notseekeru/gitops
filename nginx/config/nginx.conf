worker_processes  auto;
error_log          /dev/stderr warn;
pid                /run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ── Temp paths (all under a single tmpfs mount) ───────────
  client_body_temp_path /var/lib/nginx/tmp/client_body;
  proxy_temp_path       /var/lib/nginx/tmp/proxy;
  fastcgi_temp_path     /var/lib/nginx/tmp/fastcgi;
  uwsgi_temp_path       /var/lib/nginx/tmp/uwsgi;
  scgi_temp_path        /var/lib/nginx/tmp/scgi;

  # ── Logging ─────────────────────────────────────────────────
  log_format json_combined escape=json '{'
      '"time_local":"$time_local",'
      '"remote_addr":"$remote_addr",'
      '"request":"$request",'
      '"status":$status,'
      '"body_bytes_sent":$body_bytes_sent,'
      '"request_time":$request_time,'
      '"http_referrer":"$http_referer",'
      '"http_user_agent":"$http_user_agent",'
      '"http_x_request_id":"$http_x_request_id"'
  '}';

  map $request_uri $loggable {
      ~*\.(js|css|png|jpg|jpeg|gif|ico|woff|woff2|svg|webp)$ 0;
      default 1;
  }

  access_log /dev/stdout json_combined if=$loggable;
  log_not_found on;

  # ── Performance ─────────────────────────────────────────────
  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65;
  types_hash_max_size 2048;

  # ── Security: information disclosure ────────────────────────
  server_tokens off;

  # ── Security: request hardening ─────────────────────────────
  client_max_body_size        10m;
  client_body_buffer_size     128k;
  client_header_buffer_size   1k;
  large_client_header_buffers 4 8k;

  # ── Security: proxy hardening ───────────────────────────────
  proxy_buffer_size           4k;
  proxy_connect_timeout       10s;
  proxy_send_timeout          30s;
  proxy_read_timeout          60s;

  # ── Rate limiting zones ─────────────────────────────────────
  include snippets/rate-limit.conf;

  # ── Real IP (Cloudflare) ────────────────────────────────────
  include snippets/cloudflare-ip-ranges.conf;
  real_ip_header CF-Connecting-IP;

  # ── Dynamic header maps (consumed by h5bp/*) ────────────────
  # CORS: allow only *.seekeru.tech origins
  map $http_origin $cors_origin {
      default "";
      "~^https?://([^/]+\.)?seekeru\.tech$" "$http_origin";
  }

  # Permissions Policy: strict defaults
  map $host $permissions_policy {
      default "camera=(), microphone=(), geolocation=(), payment=(), usb=()";
  }

  # Cross-Origin policies: strict defaults
  map $host $coep_policy  { default "none"; }
  map $host $coop_policy  { default "same-origin"; }
  map $host $corp_policy  { default "same-origin"; }

  # Content Security Policy: per-domain overrides
  map $host $content_security_policy {
      default "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; upgrade-insecure-requests;";
      "portfolio.seekeru.tech" "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self';";
  }

  # ── Virtual hosts ───────────────────────────────────────────
  include /etc/nginx/conf.d/*.conf;
}
