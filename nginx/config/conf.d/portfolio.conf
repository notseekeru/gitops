# portfolio.seekeru.tech — browser-facing static frontend + API proxy.
# TLS terminated at Cloudflare. Security headers via h5bp/basic.conf.
server {
    listen 8080;
    server_name portfolio.seekeru.tech;

    # ──────────────────────────────────────────────────────────────────
    # API backend proxy
    # ──────────────────────────────────────────────────────────────────
    location /api {
        include snippets/resolver.conf;
        include snippets/proxy-headers.conf;

        limit_req  zone=api burst=20 nodelay;
        limit_conn conn_per_ip 10;

        set $upstream_backend portfolio-prod-backend;
        proxy_pass http://$upstream_backend:5000;
    }

    # ──────────────────────────────────────────────────────────────────
    # Static frontend (SPA)
    # ──────────────────────────────────────────────────────────────────
    location / {
        limit_except GET HEAD {
            deny all;
        }

        include snippets/resolver.conf;
        include snippets/proxy-headers.conf;

        set $upstream_frontend portfolio-prod-frontend;
        proxy_pass http://$upstream_frontend:8080;
    }

    # Security & performance headers
    include h5bp/basic.conf;
}
