# ----------------------------------------------------------------------
# | Character encodings                                               |
# ----------------------------------------------------------------------
# Served for all text/html and text/plain content.
# https://nginx.org/en/docs/http/ngx_http_charset_module.html#charset
charset utf-8;
charset_types
    text/css
    text/plain
    text/vnd.wap.wml
    text/javascript
    text/markdown
    text/calendar
    text/x-component
    text/vcard
    text/cache-manifest
    text/vtt
    application/json
    application/manifest+json;

# ----------------------------------------------------------------------
# | Security headers                                                  |
# ----------------------------------------------------------------------
# Note: X-Content-Type-Options is set inside this file.
include h5bp/security/referrer-policy.conf;
include h5bp/security/strict-transport-security.conf;
include h5bp/security/x-frame-options.conf;
include h5bp/security/content-security-policy.conf;
include h5bp/security/permissions-policy.conf;
include h5bp/security/cross-origin-policy.conf;
include h5bp/cross-origin/requests.conf;