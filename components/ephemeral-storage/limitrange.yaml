apiVersion: v1
kind: LimitRange
metadata:
  name: ephemeral-storage
spec:
  limits:
    # Nodefs is one filesystem shared with kubelet: a pod that writes without a request is
    # ranked as a zero consumer and evicted last-ish, but nothing bounds it. On 2026-10-05 a
    # 24G write outside the cluster pushed nodefs under the kubelet floor and DiskPressure
    # evicted every pod on the node, ArgoCD included. defaultRequest puts every container in
    # the eviction ranking; default caps growth. max rejects a pod that would repeat it.
    - type: Container
      defaultRequest:
        ephemeral-storage: 64Mi
      default:
        ephemeral-storage: 512Mi
      max:
        ephemeral-storage: 2Gi
