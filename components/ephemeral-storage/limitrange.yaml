apiVersion: v1
kind: LimitRange
metadata:
  name: ephemeral-storage
spec:
  limits:
    # nodefs is shared with kubelet: a container with no request ranks as a zero consumer and is
    # evicted last, and nothing bounds it. defaultRequest puts it in the ranking, default caps
    # growth, max rejects a pod that would repeat the outage.
    - type: Container
      defaultRequest:
        ephemeral-storage: 64Mi
      default:
        ephemeral-storage: 512Mi
      max:
        ephemeral-storage: 2Gi
