apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: diagram
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/notseekeru/gitops.git
    path: apps/diagram
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
