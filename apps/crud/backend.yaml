apiVersion: apps/v1
kind: Deployment
metadata:
  name: crud-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crud-backend
  template:
    metadata:
      labels:
        app: crud-backend
    spec:
      imagePullSecrets:
        - name: ghcr-login
      containers:
        - name: backend
          # ponytail: adjust image tag and port to match your Node build
          image: ghcr.io/notseekeru/crud-backend:latest
          ports:
            - containerPort: 4000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: database-url
            - name: NODE_ENV
              value: "production"
          livenessProbe:
            tcpSocket:
              port: 4000
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              memory: "256Mi"
            requests:
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: crud-backend
spec:
  selector:
    app: crud-backend
  ports:
    - port: 4000
      targetPort: 4000
