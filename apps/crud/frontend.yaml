apiVersion: apps/v1
kind: Deployment
metadata:
  name: crud-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crud-frontend
  template:
    metadata:
      labels:
        app: crud-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-login
      containers:
        - name: frontend
          # ponytail: adjust image tag and port to match your React build
          image: ghcr.io/notseekeru/crud-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: REACT_APP_API_URL
              value: "https://diagram.seekeru.tech/api"
          livenessProbe:
            tcpSocket:
              port: 3000
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              memory: "128Mi"
            requests:
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: crud-frontend
spec:
  selector:
    app: crud-frontend
  ports:
    - port: 3000
      targetPort: 3000
