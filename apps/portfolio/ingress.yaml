apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: portfolio-headers@kubernetescrd,portfolio-limits@kubernetescrd
    traefik.ingress.kubernetes.io/service.serverstransport: portfolio-timeouts@kubernetescrd

spec:
  ingressClassName: traefik
  rules:
    - host: portfolio.seekeru.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio-prod-frontend
                port:
                  number: 8080
