apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: diagram-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: diagram-headers@kubernetescrd,diagram-limits@kubernetescrd
    traefik.ingress.kubernetes.io/service.serverstransport: diagram-timeouts@kubernetescrd

spec:
  ingressClassName: traefik
  rules:
    - host: diagram.seekeru.tech
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: diagram-prod-backend
                port:
                  number: 3100
          - path: /
            pathType: Prefix
            backend:
              service:
                name: diagram-prod-frontend
                port:
                  number: 8080
