apiVersion: batch/v1
kind: Job
metadata:
  name: maxterview-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: maxterview-migrate
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-login
      containers:
        - name: migrate
          image: ghcr.io/notseekeru/maxterview_backend:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # Owner DSN: never wire this into the backend.
              DSN="${OWNER_DATABASE_URL:-}"
              if [ -z "$DSN" ]; then
                echo "FATAL: OWNER_DATABASE_URL is not set in maxterview-owner-secrets" >&2
                exit 1
              fi
              echo "applying migrations to ${DSN##*@}"
              exec /app/.venv/bin/yoyo apply --no-config-file --batch --database "$DSN" /app/migrations
          envFrom:
            - secretRef:
                name: maxterview-owner-secrets
          resources:
            requests:
              memory: "64Mi"
              cpu: "10m"
            limits:
              memory: "256Mi"
