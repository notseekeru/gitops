# Log pipeline (M13 tier 2) plus the OTLP receiver the backend exports to (M13 tier 3): the app's
# stdout and its spans/metrics all leave through this pod.
#
# One Deployment, not a DaemonSet: loki.source.kubernetes tails through the Kubernetes API, so this
# needs no hostPath, no node filesystem and no privileged container — just pods list/watch plus
# pods/log get in this namespace. The Grafana write credential lives here and nowhere else; the app
# itself never holds one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maxterview-alloy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: maxterview-alloy
rules:
  # discovery.kubernetes (role=pod) lists and watches pods in this namespace only (see the
  # namespaces block in the config below), and loki.source.kubernetes reads their logs via the API.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Reading container logs. Nothing here can read Secrets or write anything.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maxterview-alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: maxterview-alloy
subjects:
  - kind: ServiceAccount
    name: maxterview-alloy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: maxterview-alloy
data:
  config.alloy: |
    // maxterview pod logs -> Grafana Cloud Loki (M13 tier 2).
    //
    // Tails through the Kubernetes API (loki.source.kubernetes), so there is no hostPath, no privileged
    // container and no node filesystem: Alloy only needs pods list/watch and pods/log get in this
    // namespace. Rediscovery scope is what keeps it cheap — a DaemonSet watching every pod on the node
    // is the documented 3 GB/pod footgun.

    discovery.kubernetes "pods" {
      role = "pod"

      // Namespaced discovery: the Role grants pods list/watch in THIS namespace only, and discovery
      // lists cluster-wide by default — without this a namespaced Role yields zero targets (403).
      namespaces {
        own_namespace = true
      }
    }

    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      // Skip finished pods. A Completed Job pod (the migration) has no live stream, and tailing it
      // through the API re-opens the closed stream in a hot loop (~2/s) forever.
      // `drop` on the finished phases rather than `keep` on Running, so a missing label can never
      // silently drop every target.
      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        regex         = "Succeeded|Failed"
        action        = "drop"
      }

      // Namespace is the env proxy: the namespace IS the environment (maxterview = prod).
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      // app=maxterview-backend / maxterview-frontend / maxterview-alloy, from the pod label.
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.write.cloud.receiver]
    }

    loki.write "cloud" {
      endpoint {
        // https://logs-prod-<region>.grafana.net/loki/api/v1/push — Grafana Cloud's logs endpoint.
        url = sys.env("LOKI_URL")
        basic_auth {
          // Grafana Cloud uses the stack's numeric instance ID as the user, and the access-policy
          // token as the password. That token carries logs:write, metrics:write and traces:write and
          // is the one credential behind this whole pipeline.
          username = sys.env("LOKI_USER")
          password = sys.env("LOKI_TOKEN")
        }
      }

      external_labels = {
        cluster = "k3s",
        app     = "maxterview",
      }
    }

    // backend/src/app/telemetry.py -> here -> Grafana Cloud Tempo and Prometheus via the OTLP
    // gateway, which routes by signal. HTTP only: the Python exporter speaks HTTP/protobuf, so there
    // is no second listen address to own.
    //
    // In-cluster and unauthenticated on purpose: the receiver is reachable only through the ClusterIP
    // Service below, and the app is not allowed near the Grafana credential, so the namespace is the
    // trust boundary, exactly as it already is for the log tailing.
    otelcol.receiver.otlp "apps" {
      http {
        endpoint = "0.0.0.0:4318"
      }

      output {
        metrics = [otelcol.processor.batch.apps.input]
        traces  = [otelcol.processor.batch.apps.input]
      }
    }

    // One export per batch, not one per span: a chat turn closes a handful of spans in a burst.
    otelcol.processor.batch "apps" {
      timeout = "5s"

      output {
        metrics = [otelcol.exporter.otlphttp.cloud.input]
        traces  = [otelcol.exporter.otlphttp.cloud.input]
      }
    }

    otelcol.exporter.otlphttp "cloud" {
      client {
        // https://otlp-gateway-<zone>.grafana.net/otlp
        endpoint = sys.env("OTLP_URL")
        auth     = otelcol.auth.basic.cloud.handler
        timeout  = "10s"
      }
    }

    otelcol.auth.basic "cloud" {
      username = sys.env("LOKI_USER")
      password = sys.env("LOKI_TOKEN")
    }
---
apiVersion: v1
kind: Service
metadata:
  name: maxterview-alloy
spec:
  selector:
    app: maxterview-alloy
  ports:
    # ClusterIP only, and only this port: 12345 is the Alloy UI and has no business being reachable
    # from another pod.
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maxterview-alloy
spec:
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app: maxterview-alloy
  template:
    metadata:
      labels:
        app: maxterview-alloy
      annotations:
        # Rolls the pod whenever the config below changes: Argo updating a ConfigMap does not
        # restart anything, and Alloy reads its config at startup. Bump this hash with the config:
        # sed -n '/^  config\.alloy: |/,/^---/p' apps/maxterview/base/alloy.yaml | sha256sum | cut -c1-12
        maxterview/config-hash: "aa1710675542"
    spec:
      serviceAccountName: maxterview-alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.19.2
          args:
            - run
            - /etc/alloy/config.alloy
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
          ports:
            - name: http
              containerPort: 12345
            - name: otlp-http
              containerPort: 4318
          # The write credential is a Secret created by Terraform from Infisical (`make apply
          # MOD=k3s`), same pattern as maxterview-secrets. Keys are the env-var names the config
          # reads via sys.env().
          env:
            - name: LOKI_URL
              valueFrom:
                secretKeyRef:
                  name: maxterview-logs
                  key: LOKI_URL
            - name: LOKI_USER
              valueFrom:
                secretKeyRef:
                  name: maxterview-logs
                  key: LOKI_USER
            - name: LOKI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: maxterview-logs
                  key: LOKI_TOKEN
            - name: OTLP_URL
              valueFrom:
                secretKeyRef:
                  name: maxterview-logs
                  key: OTLP_URL
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 12345
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "10m"
              memory: "96Mi"
            limits:
              memory: "256Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: storage
              mountPath: /var/lib/alloy/data
      volumes:
        - name: config
          configMap:
            name: maxterview-alloy
        - name: storage
          emptyDir: {}
