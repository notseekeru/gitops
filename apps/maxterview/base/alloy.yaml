apiVersion: v1
kind: ServiceAccount
metadata:
  name: maxterview-alloy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: maxterview-alloy
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maxterview-alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: maxterview-alloy
subjects:
  - kind: ServiceAccount
    name: maxterview-alloy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: maxterview-alloy-nodes
rules:
  # The kubelet's own SubjectAccessReview path; not a grant to read node objects.
  - apiGroups: [""]
    resources: ["nodes/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: maxterview-alloy-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: maxterview-alloy-nodes
subjects:
  - kind: ServiceAccount
    name: maxterview-alloy
    namespace: maxterview
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: maxterview-alloy
data:
  config.alloy: |
    discovery.kubernetes "pods" {
      role = "pod"

      // discovery lists cluster-wide by default; without this a namespaced Role yields zero targets (403).
      namespaces {
        own_namespace = true
      }
    }

    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      // A Completed pod's stream re-opens in a hot loop forever; drop on phase, not keep on Running,
      // so a missing label cannot drop every target.
      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        regex         = "Succeeded|Failed"
        action        = "drop"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.write.cloud.receiver]
    }

    loki.write "cloud" {
      endpoint {
        url = sys.env("LOKI_URL")
        basic_auth {
          username = sys.env("LOKI_USER")
          password = sys.env("LOKI_TOKEN")
        }
      }

      external_labels = {
        cluster = "k3s",
        app     = "maxterview",
      }
    }

    // Unauthenticated on purpose: ClusterIP only, and the app never holds the Grafana credential.
    otelcol.receiver.otlp "apps" {
      http {
        endpoint = "0.0.0.0:4318"
      }

      output {
        metrics = [otelcol.processor.batch.apps.input]
        traces  = [otelcol.processor.batch.apps.input]
      }
    }

    otelcol.processor.batch "apps" {
      timeout = "5s"

      output {
        metrics = [otelcol.exporter.otlphttp.cloud.input]
        traces  = [otelcol.exporter.otlphttp.cloud.input]
      }
    }

    otelcol.exporter.otlphttp "cloud" {
      client {
        endpoint = sys.env("OTLP_URL")
        auth     = otelcol.auth.basic.cloud.handler
        timeout  = "10s"
      }
    }

    otelcol.auth.basic "cloud" {
      // The gateway wants its own username, not the Loki one: reusing LOKI_USER is a 401 on every
      // batch with no other symptom. The token is the same.
      username = sys.env("OTLP_USER")
      password = sys.env("LOKI_TOKEN")
    }

    // One node, so the address is written here; a second node means discovery instead.
    prometheus.scrape "containers" {
      targets           = [{"__address__" = "192.168.100.6:10250"}]
      scheme            = "https"
      metrics_path      = "/metrics/cadvisor"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config {
        ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
      }
      forward_to = [prometheus.relabel.containers_keep.receiver]
    }

    // Unfiltered, this scrape alone crosses the tenant's active-series cap and the gateway then
    // rejects whole batches. The root cgroup (`id="/"`) is the node itself; `up` catches a dead scrape.
    prometheus.relabel "containers_keep" {
      forward_to = [otelcol.receiver.prometheus.scraped.receiver]

      rule {
        source_labels = ["__name__"]
        regex         = "container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_memory_rss|container_fs_usage_bytes|container_fs_limit_bytes|container_spec_memory_limit_bytes|container_oom_events_total|machine_memory_bytes|machine_cpu_cores|up"
        action        = "keep"
      }

      // rss is the memory the kernel cannot reclaim; keep the root cgroup's only.
      rule {
        source_labels = ["__name__", "id"]
        regex         = "container_memory_rss;/.+"
        action        = "drop"
      }
    }

    otelcol.receiver.prometheus "scraped" {
      output {
        metrics = [otelcol.processor.batch.apps.input]
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: maxterview-alloy
spec:
  selector:
    app: maxterview-alloy
  ports:
    # Not 12345: that is the Alloy UI.
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maxterview-alloy
spec:
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app: maxterview-alloy
  template:
    metadata:
      labels:
        app: maxterview-alloy
      annotations:
        # Editing config.alloy restarts nothing on its own. Bump this with it:
        # sed -n '/^  config\.alloy: |/,/^---/p' apps/maxterview/base/alloy.yaml | sha256sum | cut -c1-12
        maxterview/config-hash: "0c5fbfdcabec"
    spec:
      serviceAccountName: maxterview-alloy
      # CoreDNS answers SERVFAIL for some external names, so the public resolver is the fallback.
      # dnsPolicy: None inherits nothing: the search list and ndots below repeat the kubelet defaults.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 10.43.0.10
          - 1.1.1.1
        searches:
          - maxterview.svc.cluster.local
          - svc.cluster.local
          - cluster.local
        options:
          - name: ndots
            value: "5"
      containers:
        - name: alloy
          image: grafana/alloy:v1.19.2
          args:
            - run
            - /etc/alloy/config.alloy
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
          ports:
            - name: http
              containerPort: 12345
            - name: otlp-http
              containerPort: 4318
          env:
            - name: LOKI_URL
              valueFrom:
                secretKeyRef:
                  name: maxterview-logs
                  key: LOKI_URL
            - name: LOKI_USER
              valueFrom:
                secretKeyRef:
                  name: maxterview-logs
                  key: LOKI_USER
            - name: LOKI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: maxterview-logs
                  key: LOKI_TOKEN
            - name: OTLP_URL
              valueFrom:
                secretKeyRef:
                  name: maxterview-logs
                  key: OTLP_URL
            # Not a credential, so it stays in the manifest: one push turns the exporter on.
            - name: OTLP_USER
              value: "1835920"
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 12345
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "10m"
              memory: "96Mi"
            limits:
              memory: "256Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: storage
              mountPath: /var/lib/alloy/data
      volumes:
        - name: config
          configMap:
            name: maxterview-alloy
        - name: storage
          # The exporter WAL grows while Grafana is unreachable; unbounded it lands on nodefs.
          # Same ceiling as the LimitRange default.
          emptyDir:
            sizeLimit: 512Mi
