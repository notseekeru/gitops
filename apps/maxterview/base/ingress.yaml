apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: maxterview-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: maxterview-headers@kubernetescrd,maxterview-limits@kubernetescrd
    traefik.ingress.kubernetes.io/service.serverstransport: maxterview-timeouts@kubernetescrd

spec:
  ingressClassName: traefik
  rules:
    - host: maxterview.seekeru.tech
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: maxterview-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: maxterview-frontend
                port:
                  number: 8080
