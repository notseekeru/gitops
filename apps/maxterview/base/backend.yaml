apiVersion: apps/v1
kind: Deployment
metadata:
  name: maxterview-backend
spec:
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app: maxterview-backend
  template:
    metadata:
      labels:
        app: maxterview-backend
    spec:
      imagePullSecrets:
        - name: ghcr-login
      containers:
        - name: backend
          image: ghcr.io/notseekeru/maxterview_backend:latest
          ports:
            - containerPort: 8000
          # AI HERE: envFrom is all-or-nothing: keys must be UPPERCASE and exactly the app's env
          # names, or the pod never schedules. Per-key valueFrom is the precise fallback.
          envFrom:
            - secretRef:
                name: maxterview-secrets
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
          readinessProbe:
            # AI HERE: /api/health is shallow (no DB check); upgrade to a probe that hits the DB.
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              memory: "256Mi"
            requests:
              memory: "128Mi"
              cpu: "10m"
---
apiVersion: v1
kind: Service
metadata:
  name: maxterview-backend
spec:
  selector:
    app: maxterview-backend
  ports:
    - port: 8000
      targetPort: 8000
