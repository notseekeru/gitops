apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Staging (maxterview-staging.seekeru.tech) — rehearsal target: prod-shaped data, test-mode
# everything (Clerk DEVELOPMENT instance, PayMongo test keys), no real users or money.
# ArgoCD: apps-of-apps/maxterview-staging.yaml points here. Namespace + Secret come from
# `make apply MOD=k3s-staging ENV=staging` (own terraform state).
namespace: maxterview-staging
resources:
- ../../base
# The SPA inlines its Clerk publishable key at build time, so staging needs its OWN image
# (`.env.staging` -> the Development instance's pk_test_) — same repo, `staging-` tag prefix,
# built and bumped by the CD matrix entry (D14's revisit trigger, landed).
images:
- name: ghcr.io/notseekeru/maxterview_backend
  newName: ghcr.io/notseekeru/maxterview_backend
  newTag: 603c9567b09c04662fb3d169ee6e7b82d3d0e4bc
- name: ghcr.io/notseekeru/maxterview_frontend
  newName: ghcr.io/notseekeru/maxterview_frontend
  newTag: staging-603c9567b09c04662fb3d169ee6e7b82d3d0e4bc
# Everything below is a pointer to staging's own objects; the base stays env-neutral.
patches:
- path: env.yaml
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: maxterview-staging.seekeru.tech
  target:
    kind: Ingress
    name: maxterview-ingress
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/envFrom/0/secretRef/name
      value: maxterview-staging-secrets
  target:
    kind: Deployment
    name: maxterview-backend
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/envFrom/0/secretRef/name
      value: maxterview-staging-secrets
  target:
    kind: Job
    name: maxterview-migrate
