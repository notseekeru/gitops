apiVersion: apps/v1
kind: Deployment
metadata:
  name: maxterview-backend
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            # `staging` (not production) so it is obvious which env a log line came from; CLERK_ENABLED
            # stays true because the no-Clerk DEV_USER fallback is development/test-only by design.
            - name: APP_ENV
              value: staging
            - name: CLERK_ENABLED
              value: "true"
            # PayMongo first-payment return URL (app/payments.py) — the staging origin, never prod's.
            - name: FRONTEND_BASE_URL
              value: "https://maxterview-staging.seekeru.tech"
