apiVersion: apps/v1
kind: Deployment
metadata:
  name: maxterview-backend
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            # production refuses to boot unless CLERK_ENABLED=true (app/main.py guard).
            - name: APP_ENV
              value: production
            - name: CLERK_ENABLED
              value: "true"
            # PayMongo first-payment return URL (app/payments.py).
            - name: FRONTEND_BASE_URL
              value: "https://maxterview.seekeru.tech"
