apiVersion: apps/v1
kind: Deployment
metadata:
  name: maxterview-backend
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            # Prod refuses to boot with this false.
            - name: APP_ENV
              value: production
            - name: CLERK_ENABLED
              value: "true"
            - name: FRONTEND_BASE_URL
              value: "https://maxterview.seekeru.tech"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://maxterview-alloy:4318"
            # env outranks envFrom, so this overrides whatever the Secret holds.
            - name: DEV_CHAT_TURNS
              value: "100000000"
