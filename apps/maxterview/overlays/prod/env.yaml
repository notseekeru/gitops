apiVersion: apps/v1
kind: Deployment
metadata:
  name: maxterview-backend
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            # production refuses to boot unless CLERK_ENABLED=true (app/main.py guard).
            - name: APP_ENV
              value: production
            - name: CLERK_ENABLED
              value: "true"
            # PayMongo first-payment return URL (app/payments.py).
            - name: FRONTEND_BASE_URL
              value: "https://maxterview.seekeru.tech"
            # The in-cluster Alloy OTLP receiver (app/telemetry.py). Unset would be a supported
            # value: no SDK, nothing exported. Nothing here holds the Grafana write credential.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://maxterview-alloy:4318"
