apiVersion: apps/v1
kind: Deployment
metadata:
  name: maxterview-backend
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            # The two guards in app/main.py read these: APP_ENV=test is what allows Clerk off at all
            # (the boot guard) and what keeps /billing/webhook/simulate answering outside production.
            - name: APP_ENV
              value: test
            - name: CLERK_ENABLED
              value: "false"
            # The app's own limiter, not the ingress: 120/minute per client IP would cap the sweep at
            # its first level. SRE.md `## Configuration`.
            - name: RATE_LIMIT
              value: "off"
            # Empty beats the secret's LLM_* through envFrom, which is what puts the pod in stub mode
            # (app/llm.py reads it at import, so the pod must be replaced for this to take effect).
            - name: LLM_BASE_URL
              value: ""
            # One identity for every virtual user, and the owner the between-step cleanup deletes.
            - name: DEV_USER_SUB
              value: loadtest-sweep
