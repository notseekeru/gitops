apiVersion: apps/v1
kind: Deployment
metadata:
  name: maxterview-backend
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            # test is what lets Clerk stay off and the simulate webhook answer.
            - name: APP_ENV
              value: test
            - name: CLERK_ENABLED
              value: "false"
            # Off so the app's own limiter is the only check in the measured path.
            - name: RATE_LIMIT
              value: "off"
            # Empty beats the Secret's LLM_*: stub mode. app/llm.py reads it at import, so the pod
            # must be replaced for this to take effect.
            - name: LLM_BASE_URL
              value: ""
            - name: DEV_USER_SUB
              value: k6-sweep-testing
            # 80 for the pool probe; prod ships 40 in overlays/prod/env.yaml.
            - name: DB_POOL_MAX
              value: "80"
