apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Patches prod in place: never a second Deployment, two pods on one node fight for the same cores.
#
# Nothing syncs this. ArgoCD points at overlays/prod: swap that path for the duration, or
# `kubectl apply -k apps/maxterview/overlays/perf`, then point it back.
namespace: maxterview
resources:
- ../prod
patches:
- path: env.yaml
- path: ingress.yaml
- path: service.yaml
